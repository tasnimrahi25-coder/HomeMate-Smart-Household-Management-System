<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HomeMate – Food & Recipes</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
(async () => {
  if (!renderShell('recipes', 'Recipes')) return;

  const CATS = ['All', 'Breakfast', 'Lunch', 'Dinner', 'Snacks'];
  const INGS = ['Rice', 'Eggs', 'Chicken', 'Vegetables', 'Milk', 'Flour', 'Onion', 'Tomato'];
  let recipes = await Api.list('recipes');
  let cat = 'All', q = '';
  const have = new Set();

  document.getElementById('headActions').innerHTML = '<button class="btn" id="addBtn">+ Add Recipe</button>';

  document.getElementById('page').innerHTML = `
    <div class="chips" id="chips" style="margin-bottom:16px"></div>
    <input id="search" placeholder="Search recipes..." style="width:100%;max-width:320px;padding:9px 14px;border:1px solid var(--border);border-radius:8px;margin-bottom:16px">
    <div class="recipe-layout">
      <div class="recipe-grid" id="grid"></div>
      <div class="card ing"><b>Available Ingredients</b><div id="ings" style="margin-top:8px"></div></div>
    </div>
    <div class="modal-bg" id="modal"><div class="modal">
      <h3>Add Recipe</h3>
      <input id="rName" placeholder="Recipe name">
      <input id="rTime" type="number" min="1" placeholder="Time (minutes)">
      <select id="rLevel"><option>Easy</option><option>Medium</option><option>Hard</option></select>
      <select id="rCat">${CATS.slice(1).map(c => `<option>${c}</option>`).join('')}</select>
      <input id="rIng" placeholder="Ingredients (comma দিয়ে আলাদা করো)">
      <div class="row"><button class="btn ghost" id="cancel">Cancel</button><button class="btn" id="save">Save</button></div>
    </div></div>`;

  const $ = id => document.getElementById(id);

  function draw() {
    $('chips').innerHTML = CATS.map(c => `<button class="chip ${c === cat ? 'on' : ''}" data-c="${c}">${c}</button>`).join('');
    $('ings').innerHTML = INGS.map(i =>
      `<label><input type="checkbox" value="${i}" ${have.has(i) ? 'checked' : ''}> ${i}</label>`).join('');

    let list = recipes.filter(r =>
      (cat === 'All' || r.category === cat) &&
      r.name.toLowerCase().includes(q.toLowerCase()));
    if (have.size) {                       // GET /recipes/available
      list = list.filter(r => (r.ingredients || []).some(i => have.has(i)))
                 .sort((a, b) => score(b) - score(a));
    }
    $('grid').innerHTML = list.length ? list.map(r => `
      <div class="recipe">
        <div class="pic">${r.emoji || '🍲'}</div>
        <div class="info"><b>${r.name}</b>
          <div class="meta"><span>${r.time} min</span>
            <span class="badge ${r.level === 'Easy' ? 'green' : 'orange'}">${r.level}</span></div>
        </div></div>`).join('') : '<div class="empty">কোনো recipe পাওয়া যায়নি</div>';

    $('chips').querySelectorAll('.chip').forEach(b => b.onclick = () => { cat = b.dataset.c; draw(); });
    $('ings').querySelectorAll('input').forEach(c => c.onchange = () => {
      c.checked ? have.add(c.value) : have.delete(c.value); draw();
    });
  }
  const score = r => (r.ingredients || []).filter(i => have.has(i)).length;

  $('search').oninput = e => { q = e.target.value; draw(); };
  $('addBtn').onclick = () => $('modal').classList.add('show');
  $('cancel').onclick = () => $('modal').classList.remove('show');
  $('save').onclick = async () => {
    const name = $('rName').value.trim();
    if (!name) return alert('Recipe-র নাম দাও');
    const r = await Api.create('recipes', {
      name, emoji: '🍲', time: Number($('rTime').value) || 30,
      level: $('rLevel').value, category: $('rCat').value,
      ingredients: $('rIng').value.split(',').map(s => s.trim()).filter(Boolean),
    });
    recipes.push(r);
    ['rName', 'rTime', 'rIng'].forEach(i => $(i).value = '');
    $('modal').classList.remove('show');
    draw();
  };

  draw();
})();
</script>
</body>
</html>
