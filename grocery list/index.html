<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery Management</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../app-navigation.css">
</head>
<body>

    <nav class="hm-nav" aria-label="HomeMate features">
        <a class="hm-nav-brand" href="../Dashboard/index.html">HomeMate</a>
        <div class="hm-nav-links">
            <a href="../Dashboard/index.html">Dashboard</a>
            <a href="../grocery%20list/index.html" aria-current="page">Groceries</a>
            <a href="../Recipe_finder/index.html">Recipes</a>
            <a href="../Budget_tracker/index.html">Budget</a>
            <a href="../expense%20tracker/index2.html">Expenses</a>
            <a href="../login-register/index.html">Log in</a>
        </div>
    </nav>
    <div class="container">
        <div class="top-bar">
            <div class="search-box">
                <i class="fa fa-search"></i>
                <input type="text" id="search-input" placeholder="Search grocery items...">
            </div>
            <div class="user-area">
                <span class="avatar">U</span>
                <i class="fa fa-bell"></i>
            </div>
        </div>
        <div class="header-section">
            <h2>Grocery List</h2>
            <button class="add-btn" id="show-add-form" type="button"><i class="fa fa-plus"></i> Add Item</button>
        </div>
        <form class="add-grocery-form" id="add-grocery-form" hidden>
            <label class="visually-hidden" for="new-grocery-name">Grocery item name</label>
            <input id="new-grocery-name" type="text" maxlength="80" placeholder="What do you need?" required>
            <button class="add-btn" type="submit">Save item</button>
        </form>
        <div class="cards-box">
            <div class="card green">
                <div>
                    <p>Total Items</p>
                    <h3 id="total-count">8</h3>
                </div>
            </div>
            <div class="card blue">
                <div>
                    <p>Purchased</p>
                    <h3 id="purchased-count">4</h3>
                </div>
            </div>
            <div class="card orange">
                <div>
                    <p>Remaining</p>
                    <h3 id="remaining-count">4</h3>
                </div>
            </div>
        </div>
        <div class="grocery-list" id="list-container">
        </div>
    </div>
    <script src="../app-data.js"></script>
    <script src="script.js"></script>
</body>
</html>
