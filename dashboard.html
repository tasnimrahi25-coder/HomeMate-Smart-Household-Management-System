<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HomeMate – Dashboard</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
(async () => {
  const user = renderShell('dashboard', `Good Morning, ${Api.currentUser()?.name || 'User'}!`,
    "Here's what's happening with your home today.");
  if (!user) return;

  const d = await Api.dashboard();
  const badge = n => n <= 1 ? ['red', n === 0 ? 'Today' : 'Tomorrow'] : n <= 3 ? ['orange', n + ' days'] : ['green', n + ' days'];

  document.getElementById('page').innerHTML = `
    <div class="grid g4" style="margin-bottom:16px">
      <div class="card stat red"><div class="label">Total Expenses</div><div class="value">${taka(d.totalExpense)}</div><div class="sub">This Month</div></div>
      <div class="card stat green"><div class="label">Groceries</div><div class="value">${d.groceryItems} Items</div><div class="sub">In List</div></div>
      <div class="card stat orange"><div class="label">Pending Chores</div><div class="value">${d.pendingChores} Tasks</div><div class="sub">To Do</div></div>
      <div class="card stat purple"><div class="label">Expiring Soon</div><div class="value">${d.expiringSoon} Items</div><div class="sub">Next 7 Days</div></div>
    </div>

    <div class="grid g2">
      <div class="card">
        <div class="list-row" style="padding-top:0"><b>Upcoming Expiry</b><a href="expiry.html">View All</a></div>
        ${d.upcomingExpiry.length ? d.upcomingExpiry.map(e => {
          const [c, t] = badge(e.left);
          return `<div class="list-row"><span>${e.name}</span><span class="badge ${c}">${t}</span></div>`;
        }).join('') : '<p style="color:var(--muted);padding:12px 0">কিছু expire হচ্ছে না 🎉</p>'}
      </div>
      <div class="card">
        <b>Monthly Expense Overview</b>
        <div style="margin-top:16px">${donut(d.byCategory)}</div>
      </div>
    </div>`;
})();
</script>
</body>
</html>
