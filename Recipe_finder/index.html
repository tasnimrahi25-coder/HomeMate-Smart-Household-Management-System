            <nav class="hm-nav__links" id="hm-nav-links" data-nav-links aria-label="Primary navigation">

    </header>
<div class="recipe-finder-container">
    <h1>Recipe Finder</h1>

        <form id="search-form" class="search-box">
            <input type="text" id="search-input" placeholder="Search by recipe name (e.g. pudding, pasta, salad)"/>
           
            <button type="submit" id="search-button">Search</button>
        </form>

        <form id="pantry-search-form" class="pantry-search">
            <label for="pantry-search-input">Cook with what you have</label>
            <p>Enter ingredients separated by commas. We’ll show recipes that use the most of them.</p>
            <div class="search-box pantry-search-box">
                <input type="text" id="pantry-search-input" maxlength="250" placeholder="e.g. milk, sugar, eggs" required>
                <button type="submit" id="pantry-search-button">Find recipes</button>
            </div>
        </form>

        <div class="random-button-container">
            <button id="random-button">Find a Random Recipe</button>
        </div>
        <div class="message loading" id="message-area">Search for a recipe or get a random one</div>
        <div class="results-grid" id="results-grid"> </div>
           

        <div class="modal-container hidden" id="recipe-modal">
            <div class="modal-content">
                <button type="button" class="modal-close-btn" id="modal-close-btn" aria-label="Close recipe details">&times;</button>
                <div id="recipe-details-content">
                        </div>
                    </div>
                    </div>
                </div>


            </div>
        </div>
        </div>
    </div>
    <script type="module" src="../nav.js"></script>
    <script src="../app-data.js"></script>
    <script src="script.js"></script>
