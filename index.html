<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HomeMate - Pantry Manager</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="app-navigation.css">
</head>
<body>

  <nav class="hm-nav" aria-label="HomeMate features">
    <a class="hm-nav-brand" href="Dashboard/index.html">HomeMate</a>
    <div class="hm-nav-links">
      <a href="Dashboard/index.html">Dashboard</a>
      <a href="grocery%20list/index.html">Groceries</a>
      <a href="Recipe_finder/index.html">Recipes</a>
      <a href="Budget_tracker/index.html">Budget</a>
      <a href="expense%20tracker/index2.html">Expenses</a>
      <a href="login-register/index.html">Log in</a>
    </div>
  </nav>
  <div class="container">
    <a class="home-link" href="Dashboard/index.html">&larr; HomeMate dashboard</a>
    <h2>🏠 HomeMate Pantry</h2>

    <div>
      <h3>Add New Item</h3>
      <div class="form-group">
        <input type="text" id="itemName" placeholder="Item Name (e.g., Milk)">
      </div>
      <div class="form-group">
        <input type="text" id="itemQuantity" placeholder="Quantity (e.g., 2)">
      </div>
      <div class="form-group">
        <input type="text" id="itemUnit" placeholder="Unit (e.g., Liters)">
      </div>
      <div class="form-group">
        <input type="text" id="expiryDate" placeholder="Expiry Date / Days (e.g., 7)">
      </div>
      <button id="addBtn">Save Item</button>
    </div>

    <hr style="margin: 20px 0;">

    <h3>Pantry Items List</h3>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Quantity</th>
          <th>Unit</th>
          <th>Expiry</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="pantryTableBody">
        <tr><td colspan="5">Loading data...</td></tr>
      </tbody>
    </table>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
