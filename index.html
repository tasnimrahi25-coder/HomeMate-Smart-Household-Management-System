<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HomeMate - Pantry Manager</title>
  <!-- Link external CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h2>🏠 HomeMate Pantry</h2>

    <div>
      <h3>Add New Item</h3>
      <div class="form-group">
        <input type="text" id="itemName" placeholder="Item Name (e.g., Milk)">
      </div>
      <div class="form-group">
        <input type="text" id="itemQuantity" placeholder="Quantity (e.g., 2)">
      </div>
      <div class="form-group">
        <input type="text" id="itemUnit" placeholder="Unit (e.g., Liters)">
      </div>
      <div class="form-group">
        <input type="text" id="expiryDate" placeholder="Expiry Date / Days (e.g., 7)">
      </div>
      <button id="addBtn">Save Item</button>
    </div>

    <hr style="margin: 20px 0;">

    <h3>Pantry Items List</h3>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Quantity</th>
          <th>Unit</th>
          <th>Expiry</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="pantryTableBody">
        <tr><td colspan="5">Loading data...</td></tr>
      </tbody>
    </table>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
